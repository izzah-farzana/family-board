/* Mobile-first layout refinements for phones */
@media (max-width: 600px) {
  html, body { width:100%; min-width:0; min-height:100%; height:auto; overflow-x:hidden; }
  body { display:flex; flex-direction:column; overflow-y:auto; font-size:16px; padding-bottom:env(safe-area-inset-bottom,0px); }
  header {
    display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; align-items:center;
    gap:.35rem .5rem; width:100%; padding:.55rem .65rem;
    border-radius:0; position:relative;
  }
  #clock { font-size:1.55rem; line-height:1; white-space:nowrap; letter-spacing:-.04em; }
  #date { min-width:0; font-size:.76rem; line-height:1.2; white-space:normal; overflow-wrap:anywhere; }
  header button:not(#bMenu):not(#bSignOut) { display:none !important; }
  #bMenu, #bSignOut { display:inline-flex !important; align-items:center; justify-content:center; min-height:38px; padding:.35rem .55rem; font-size:.78rem; white-space:nowrap; border-radius:.55rem; }
  #live { font-size:1rem !important; position:absolute; right:.45rem; bottom:-1.35rem; z-index:2; }
  #alert { margin:.5rem .65rem 0; font-size:.82rem; }
  main#boardv { display:grid; grid-template-columns:minmax(0,1fr); gap:.7rem; width:100%; padding:.7rem .6rem; min-height:0; overflow:visible; }
  main#boardv > section, main#boardv .col > section { min-width:0; width:100%; padding:.65rem; border-radius:.75rem; }
  main#boardv .col { display:grid; grid-template-columns:minmax(0,1fr); gap:.7rem; min-width:0; }

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.tc){const c=S.chores.find(x=>x.id===d.tc);if(c){const was=isDone(c),m=mem(c.who);c.last=was?"":key(new Date());if(m)m.stars=Math.max(0,(m.stars||0)+(was?-1:1));if(!was)burst(b);save()}}
  else if(d.td){const q=d.td.split("|"),md=S.meds.find(x=>x.id===q[0]),t=key(new Date());if(md){if(md.day!==t){md.day=t;md.done=[]}const was=md.done.includes(q[1]);if(!was&&md.start&&md.start>t){say("This medicine starts on "+md.start,5000);return}if(!was&&md.end&&md.end<t){say("This course ended on "+md.end,5000);return}if(!was&&md.supply!=null&&md.supply<=0){say(md.refill===false?"Course finished. No doses left.":"No doses left. Tap Refill to add more.",5000);return}md.done=was?md.done.filter(z=>z!==q[1]):[...md.done,q[1]];if(md.supply!=null)md.supply=Math.max(0,md.supply+(was?1:-1));md.log=md.log||{};if(md.done.length)md.log[t]=md.done.slice();else delete md.log[t];if(!was)burst(b);save()}}
  else if(d.mn!==undefined){if(d.mn==="0"){mo=new Date();mo.setDate(1)}else{mo=new Date(mo.getFullYear(),mo.getMonth()+ +d.mn,1)}renderMonth()}
  else if(d.mm){medMode={full:"count",count:"off",off:"full"}[medMode];try{localStorage.setItem("fb_mm",medMode)}catch(e){}renderMonth()}
  else if(d.ma){$("bEv").click()}
  else if(d.ht){const q=d.ht.split("|"),md=S.meds.find(x=>x.id===q[0]);if(md){md.log=md.log||{};const a=md.log[q[1]]||[];const was=a.includes(q[2]);if(!was&&md.supply!=null&&md.supply<=0){say("No doses left to record.",4000);return}md.log[q[1]]=was?a.filter(z=>z!==q[2]):a.concat(q[2]);if(md.supply!=null)md.supply=Math.max(0,md.supply+(was?1:-1));save();showDay(q[1])}}
  else if(d.em){close();editMed(d.em)}
  else if(d.ee){close();editEvent(d.ee)}
  else if(d.reg){const m=mem($("iam").value);if(m&&myId){S.members.forEach(x=>{if(x.uid===myId)delete x.uid});m.uid=myId;save();say("Registered as "+m.name+" ✅");close()}else say("Sign in to claude.ai first")}
  else if(d.copy){try{navigator.clipboard.writeText(location.href).then(()=>say("Link copied ✅")).catch(()=>say("Copy not allowed here"))}catch(e){say("Copy not allowed here")}}
  else if(d.tw){const o=$("dbgl"),L=m=>{dbg(m);o.textContent=DBG.join("\n")};
    if(!DB){L("no db connection");return}
    const r=DB.doc("family/test"),v=Date.now();L("test: writing...");
    r.set({t:v}).then(()=>r.get()).then(s=>L("test: wrote "+v+", read back "+(s.exists&&s.data().t)+((s.exists&&s.data().t===v)?" OK":" MISMATCH"))).catch(e=>L("test FAILED "+(e&&e.code)+" "+(e&&e.message)))}
  else if(d.lg){setView(d.lg==="all"?"":(view===d.lg?"":d.lg))}
  else if(d.cl){close()}
  else if(d.add){close();$("bEv").click();if($("f2"))$("f2").value=d.add}
  else if(d.th){S.theme=d.th;applyTheme();save();close()}
  else if(d.ds){const q=d.ds.split("|"),ev=S.events.find(x=>x.id===q[0]);if(ev){ev.skip=ev.skip||[];if(!ev.skip.includes(q[1]))ev.skip.push(q[1]);save()}}
  else if(d.dr){const q=d.dr.split("|"),ev=S.events.find(x=>x.id===q[0]);if(ev){ev.skip=(ev.skip||[]).filter(z=>z!==q[1]);save()}}
  else if(d.gt){const i=S.groc.find(x=>x.id===d.gt);if(i){i.done=!i.done;if(i.done)say(pick(["In the trolley! 🛒","Got it! ✅","Yum, nice choice! 😋"]));save()}}
  else if(d.gd){S.groc=S.groc.filter(x=>x.id!==d.gd);save()}
  else if(d.pe){const m=mem(d.pe),E=["🦊","🐼","🐯","🦄","🐸","🐙","🚀","🌈"];if(m){m.emoji=E[(E.indexOf(m.emoji)+1)%E.length];save()}}
  else if(d.pc){const m=mem(d.pc);if(m){m.color=COLORS[(COLORS.indexOf(m.color)+1)%COLORS.length];save()}}
  else if(d.rf){const md=S.meds.find(x=>x.id===d.rf);if(md)open(`<h2>Confirm refill: ${esc(md.name)}</h2><div style="font-size:.85em;color:var(--mut)">The schedule is extended only for the doses you add here.</div><input id="f1" type="number" min="1" placeholder="Doses/pills added">`,()=>{const v=+$("f1").value;if(!(v>0))return false;syncSupply(md);md.total=(md.total==null?0:md.total)+v;md.refills=md.refills||[];md.refills.push({d:key(new Date()),q:v});say("Refill confirmed ✅ Schedule extended",4000);save()})}
  else if(d.dd){S.meds=S.meds.filter(x=>x.id!==d.dd);save()}
  else if(d.dc){S.chores=S.chores.filter(x=>x.id!==d.dc);save()}
  else if(d.de){S.events=S.events.filter(x=>x.id!==d.de);save()}
  else if(d.dm){S.members=S.members.filter(x=>x.id!==d.dm);S.chores=S.chores.filter(x=>x.who!==d.dm);S.meds=S.meds.filter(x=>x.who!==d.dm);save()}
});

async function loadCloudBoard(user){
  currentUser=user;myId=user.id;platform="owner";role="owner";applyRole();
  const {data,error}=await supabaseClient.from("family_board").select("data").eq("owner_id",user.id).maybeSingle();
  if(error)throw error;
  if(data&&data.data){
    const d=data.data;S={...S,...d,members:d.members||[],events:d.events||[],chores:d.chores||[],meds:d.meds||[],groc:d.groc||[]};
  }else{
    const initial=JSON.parse(JSON.stringify(S));
    const {error:insertError}=await supabaseClient.from("family_board").insert({owner_id:user.id,data:initial});
    if(insertError)throw insertError;
  }
  authReady=true;$("authGate").style.display="none";$("live").textContent="🟢";$("live").title="Connected to Supabase cloud";$("note").textContent="";rollWeek();render();
  if(window.__familyBoardChannel)supabaseClient.removeChannel(window.__familyBoardChannel);
  window.__familyBoardChannel=supabaseClient.channel("family-board-"+user.id).on("postgres_changes",{event:"UPDATE",schema:"public",table:"family_board",filter:"owner_id=eq."+user.id},payload=>{
    if(!payload.new||!payload.new.data)return;
    const d=payload.new.data;S={...S,...d,members:d.members||[],events:d.events||[],chores:d.chores||[],meds:d.meds||[],groc:d.groc||[]};rollWeek();render();
  }).subscribe();
}
$("authForm").addEventListener("submit",async e=>{
  e.preventDefault();const email=$("authEmail").value.trim(),password=$("authPassword").value;$("authError").textContent="Signing in…";
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error){$("authError").textContent=error.message;return}
  try{await loadCloudBoard(data.user)}catch(err){$("authError").textContent="Signed in, but could not load board: "+err.message}
});
$("authSignUp").addEventListener("click",async()=>{
  const email=$("authEmail").value.trim(),password=$("authPassword").value;if(!email||password.length<8){$("authError").textContent="Enter a valid email and a password with at least 8 characters.";return}
  $("authError").textContent="Creating account…";
  const {data,error}=await supabaseClient.auth.signUp({email,password});
  if(error){$("authError").textContent=error.message;return}
  if(data.session&&data.user){try{await loadCloudBoard(data.user)}catch(err){$("authError").textContent=err.message}}
  else{$("authError").textContent="Account created. Check your email for the confirmation link, then return here and sign in."}
});
supabaseClient.auth.getSession().then(async({data,error})=>{
  if(error){$("authError").textContent=error.message;return}
  if(data.session){try{await loadCloudBoard(data.session.user)}catch(err){$("authError").textContent="Could not load your board: "+err.message}}
}).catch(e=>{$("authError").textContent=e.message});
$("bSignOut").onclick=async()=>{if(confirm("Sign out of Family Board?"))await supabaseClient.auth.signOut()};
supabaseClient.auth.onAuthStateChange((event,session)=>{
  if(event==="SIGNED_OUT"){currentUser=null;authReady=false;$("authGate").style.display="grid";$("live").textContent="⚪"}
});
</script>
